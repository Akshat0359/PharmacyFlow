[project]
name = "pharmacyflow-ai"
version = "0.1.0"
description = "Synthetic pharmacy workflow and agent reliability laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.38,<3", "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2", "pgvector>=0.3,<1", "langgraph==1.0.3",
  "langgraph-checkpoint==3.0.0", "langgraph-checkpoint-postgres==3.0.0", "langgraph-checkpoint-sqlite==3.0.0",
  "langsmith==0.4.42",
  "uuid-utils==0.12.0",
  "ormsgpack==1.10.0",
  "aiosqlite==0.21.0",
  "mcp>=1.20,<2", "playwright>=1.51,<2", "openai>=2,<3",
  "python-multipart>=0.0.20,<1", "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "pillow>=11,<13", "pymupdf>=1.25,<2", "httpx>=0.28,<1",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pyyaml>=6,<7"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
