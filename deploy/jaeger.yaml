service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [jaeger_storage_exporter]
extensions:
  jaeger_query:
    storage:
      traces: persistent
  jaeger_storage:
    backends:
      persistent:
        badger:
          ephemeral: false
          ttl:
            spans: 48h
          directories:
            keys: /traces/keys
            values: /traces/values
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
exporters:
  jaeger_storage_exporter:
    trace_storage: persistent
