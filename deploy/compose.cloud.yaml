services:
  api:
    environment:
      TRACE_VIEWER_URL: ""
      DEMO_MODE: "false"
      ALLOW_FAULT_INJECTION: "false"
    mem_limit: 1g
    cpus: 1.0
  migrate:
    environment:
      DEMO_MODE: "false"
      ALLOW_FAULT_INJECTION: "false"
  mock:
    environment:
      DEMO_MODE: "false"
      ALLOW_FAULT_INJECTION: "false"
    mem_limit: 512m
  mcp:
    environment:
      DEMO_MODE: "false"
      ALLOW_FAULT_INJECTION: "false"
    mem_limit: 512m
  worker:
    environment:
      DEMO_MODE: "false"
      ALLOW_FAULT_INJECTION: "false"
    mem_limit: 2g
    cpus: 1.5
  db:
    mem_limit: 1g
  jaeger:
    mem_limit: 768m
  otel:
    mem_limit: 256m
  caddy:
    image: caddy:2.10.2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public DNS name}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  caddydata:
  caddyconfig:
